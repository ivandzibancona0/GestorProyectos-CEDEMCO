<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062b5c"/>
      <stop offset="100%" stop-color="#0d68a8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b619"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#ffffff" stroke="#dde4ec" stroke-width="2" filter="url(#shadow)"/>

  <!-- Golden Gear Arch -->
  <g transform="translate(6, 4)">
    <!-- Outer Gear Arc -->
    <path d="M 44 26 A 38 38 0 0 0 44 98" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Gear teeth -->
    <path d="M 43 23 L 47 28 M 31 32 L 37 36 M 21 46 L 28 48 M 16 62 L 23 62 M 21 78 L 28 76 M 31 92 L 37 88 M 43 101 L 47 96" 
          stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Inner Gear Arc -->
    <path d="M 46 36 A 27 27 0 0 0 46 88" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Stylized Bold 'C' & 'M' monogram for CEDEMCO -->
  <path d="M 78 40 C 62 40 50 51 50 64 C 50 77 62 88 78 88 C 87 88 94 84 98 78 L 89 72 C 86 76 82 78 78 78 C 69 78 62 72 62 64 C 62 56 69 50 78 50 C 82 50 86 52 89 56 L 98 50 C 94 44 87 40 78 40 Z" fill="url(#navyGrad)"/>
</svg>
